<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="aud.io · stream music">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="aud.io">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" href="favicon.png"/>
  <title>aud.io</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0a url('bg.png') repeat;
      background-size: 220px 220px;
    }

    @keyframes blink { 0%,49%{opacity:1} 50%,100%{opacity:0} }
    @keyframes ripple {
      0% { transform: translate(-50%,-50%) scale(0); opacity: 0.6; }
      100% { transform: translate(-50%,-50%) scale(3.5); opacity: 0; }
    }
    @keyframes fadeOut {
      0% { opacity: 1; }
      100% { opacity: 0; }
    }

    #loading-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #0a0a0a url('bg.png') repeat;
      background-size: 220px 220px;
      transition: opacity 0.6s ease;
      font-family: 'JetBrains Mono', 'Courier New', monospace;
    }
    #loading-screen.hiding {
      opacity: 0;
      pointer-events: none;
    }

    .loader-inner {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .loader-title {
      font-size: 28px;
      color: #e0e0e0;
      letter-spacing: 6px;
      margin-bottom: 6px;
    }

    .loader-sub {
      font-size: 10px;
      color: #444;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin-bottom: 48px;
    }

    .status-line {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      margin-bottom: 16px;
      height: 16px;
    }
    .cursor { animation: blink 1s step-end infinite; }

    .bar-track {
      width: 240px;
      height: 3px;
      background: #1e1e1e;
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 10px;
      border: 0.5px solid #2a2a2a;
    }
    .bar-fill {
      height: 100%;
      background: #888;
      border-radius: 2px;
      width: 0%;
      transition: width 0.3s ease;
    }
    .bar-pct {
      font-size: 11px;
      color: #444;
      letter-spacing: 0.1em;
      margin-bottom: 32px;
    }

    .enter-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.8s ease;
    }
    .enter-wrap.visible { opacity: 1; pointer-events: all; }
    .enter-label {
      font-size: 11px;
      color: #555;
      letter-spacing: 0.18em;
      text-transform: uppercase;
    }

    .tap-circle {
      position: relative;
      width: 48px; height: 48px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
    }
    .tap-ring {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid #555;
      transition: border-color 0.2s;
    }
    .tap-dot {
      position: absolute;
      width: 6px; height: 6px;
      background: #666;
      border-radius: 50%;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      transition: background 0.2s;
    }
    .ripple-el {
      position: absolute;
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 1px solid #666;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%) scale(0);
      pointer-events: none;
      opacity: 0;
    }
    .tap-circle:hover .tap-ring { border-color: #888; }
    .tap-circle:hover .tap-dot { background: #888; }
    .tap-circle.tapping .ripple-el { animation: ripple 0.6s ease-out forwards; }
  </style>
</head>
<body>

  <div id="loading-screen">
    <div class="loader-inner">
      <div class="loader-title">aud.io</div>
      <div class="loader-sub">stream · create · discover</div>
      <div class="status-line" id="status">initializing<span class="cursor">_</span></div>
      <div class="bar-track"><div class="bar-fill" id="bar"></div></div>
      <div class="bar-pct" id="pct">0%</div>
      <div class="enter-wrap" id="enter">
        <div class="enter-label">click to enter</div>
        <div class="tap-circle" id="tap" onclick="handleTap()">
          <div class="tap-ring"></div>
          <div class="tap-dot"></div>
          <div class="ripple-el" id="ripple"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    const statuses = [
      { label: "initializing", at: 0 },
      { label: "checking system requirements", at: 5 },
      { label: "loading configuration", at: 10 },
      { label: "fetching assets", at: 15 },
      { label: "installing dependencies", at: 20 },
      { label: "looking for updates", at: 25 },
      { label: "setting up environment", at: 30 },
      { label: "running diagnostics", at: 35 },
      { label: "connecting to server", at: 40 },
      { label: "authenticating", at: 45 },
      { label: "compiling resources", at: 50 },
      { label: "syncing data", at: 55 },
      { label: "optimizing cache", at: 60 },
      { label: "loading modules", at: 65 },
      { label: "verifying integrity", at: 70 },
      { label: "unpacking components", at: 75 },
      { label: "registering services", at: 80 },
      { label: "preparing interface", at: 88 },
      { label: "almost ready", at: 95 }
    ];

    const DURATION = 25000;
    const startTime = Date.now();
    const statusEl = document.getElementById('status');
    const barEl = document.getElementById('bar');
    const pctEl = document.getElementById('pct');
    const enterEl = document.getElementById('enter');

    let lastStatusIdx = -1;
    let flutterReady = false;
    let animating = true;

    function setStatus(text) {
      statusEl.innerHTML = text + '<span class="cursor">_</span>';
    }

    function showReady() {
      animating = false;
      barEl.style.width = '100%';
      pctEl.textContent = '100%';
      setStatus('done');
      setTimeout(() => enterEl.classList.add('visible'), 600);
    }

    window.addEventListener('flutter-first-frame', () => {
      flutterReady = true;
      showReady();
    });

    function tick() {
      if (!animating) return;

      const elapsed = Date.now() - startTime;
      const t = Math.min(elapsed / DURATION, 1);

      let pct;
      if (t < 0.4) {
        pct = t * 0.55 / 0.4;
      } else if (t < 0.75) {
        pct = 0.55 + (t - 0.4) * 0.2 / 0.35;
      } else {
        pct = 0.75 + (t - 0.75) * 0.2 / 0.25;
      }
      // Cap fake progress at 95% — Flutter controls the last 5%
      pct = Math.min(pct, 0.95);
      const display = Math.round(pct * 100);

      barEl.style.width = display + '%';
      pctEl.textContent = display + '%';

      for (let i = statuses.length - 1; i >= 0; i--) {
        if (display >= statuses[i].at && i !== lastStatusIdx) {
          lastStatusIdx = i;
          setStatus(statuses[i].label);
          break;
        }
      }

      if (animating) requestAnimationFrame(tick);
    }

    requestAnimationFrame(tick);

    function handleTap() {
      const tap = document.getElementById('tap');
      const ripple = document.getElementById('ripple');
      tap.classList.remove('tapping');
      void ripple.offsetWidth;
      tap.classList.add('tapping');
      setTimeout(() => tap.classList.remove('tapping'), 700);

      if (flutterReady) {
        const screen = document.getElementById('loading-screen');
        screen.classList.add('hiding');
        setTimeout(() => {
          if (screen.parentNode) screen.parentNode.removeChild(screen);
        }, 700);
      }
    }
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
