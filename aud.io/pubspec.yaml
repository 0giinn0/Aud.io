name: aud_io
description: "aud.io · stream from YouTube & SoundCloud"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  # Audio
  just_audio: ^0.9.46
  audio_service: ^0.18.18
  audio_session: ^0.1.25
  # Ui
  flex_color_scheme: ^8.4.0
  google_fonts: ^6.3.3
  flutter_animate: ^4.5.2
  # State
  provider: ^6.1.2
  # Storage
  shared_preferences: ^2.3.5
  path_provider: ^2.1.5
  permission_handler: ^11.3.1
  file_picker: ^8.1.2
  # Backend
  # Utils
  rxdart: ^0.28.0
  equatable: ^2.0.8
  intl: ^0.20.2
  collection: ^1.19.1
  uuid: ^4.5.3
  http: ^1.2.0
  # PDF (source accreditation export)
  pdf: ^3.11.1
  printing: ^5.13.3
  youtube_explode_dart: ^3.1.0
  logging: ^1.3.0
  dart_ytmusic_api: ^1.3.7
  audio_video_progress_bar: ^2.0.3
  hive: ^2.2.3
  hive_flutter: ^1.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/icons/
    - assets/images/
