name: Deploy web to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.44.0

      - name: Build Flutter web
        run: |
          cd aud.io
          flutter pub get
          flutter build web --release --dart-define=BASE_URL=https://aud-io.onrender.com

      - name: Deploy to Cloudflare Pages
        run: |
          npx wrangler pages deploy aud.io/build/web --project-name=aud-io-web --branch=main
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
