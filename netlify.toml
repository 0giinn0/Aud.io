[build]
  base = "aud.io"
  # Netlify's build image has no Flutter, so fetch the pinned SDK first.
  command = "git clone https://github.com/flutter/flutter.git -b 3.44.0 --depth 1 _flutter && _flutter/bin/flutter build web --release --dart-define=BASE_URL=https://aud-io-server.onrender.com"
  publish = "build/web"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
