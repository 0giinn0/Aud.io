<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 640" width="340" height="640">
  <defs>
    <filter id="sk" x="-5%" y="-5%" width="110%" height="110%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Paper background -->
  <rect width="340" height="640" fill="#F7F4EE" rx="4"/>

  <!-- Page title -->
  <text x="170" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#3A352C" font-style="italic">home</text>

  <!-- Phone shadow -->
  <rect x="30" y="44" width="288" height="560" rx="36" fill="#00000022"/>

  <!-- Phone frame -->
  <rect x="26" y="40" width="288" height="560" rx="36" fill="#14120F" stroke="#3A352C" stroke-width="2" filter="url(#sk)"/>

  <!-- Dynamic island -->
  <rect x="130" y="52" width="80" height="16" rx="8" fill="#0A0807"/>

  <!-- Status bar -->
  <text x="46" y="68" font-family="monospace" font-size="10" fill="#6F6A5E">9:41</text>
  <rect x="286" y="60" width="22" height="10" rx="2" fill="none" stroke="#6F6A5E" stroke-width="1.2"/>
  <rect x="308" y="63" width="2" height="4" rx="1" fill="#6F6A5E"/>
  <rect x="287" y="61" width="16" height="8" rx="1.5" fill="#6F6A5E"/>

  <!-- App name -->
  <text x="46" y="94" font-family="Georgia,serif" font-size="18" fill="#DCD8CD" font-weight="bold">aud.io</text>

  <!-- Avatar -->
  <circle cx="306" cy="87" r="13" fill="#201D18" stroke="#3A352C" stroke-width="1.2"/>
  <circle cx="306" cy="84" r="5" fill="#6F6A5E"/>
  <path d="M296,100 Q306,95 316,100" fill="#6F6A5E"/>

  <!-- Search bar -->
  <rect x="46" y="104" width="248" height="30" rx="10" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <circle cx="64" cy="119" r="6" fill="none" stroke="#6F6A5E" stroke-width="1.3"/>
  <line x1="68" y1="123" x2="72" y2="127" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <text x="80" y="124" font-family="monospace" font-size="9" fill="#6F6A5E">search anything...</text>

  <!-- Section label -->
  <text x="46" y="150" font-family="monospace" font-size="8" fill="#6F6A5E" letter-spacing="2">RECENTLY PLAYED</text>

  <!-- ── BENTO GRID ── -->

  <!-- Card 1: Big left -->
  <rect x="46" y="160" width="140" height="140" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="57" y="171" width="60" height="60" rx="8" fill="#2C2821"/>
  <text x="72" y="211" font-family="Georgia,serif" font-size="22" fill="#6F6A5E">♪</text>
  <text x="57" y="255" font-family="Georgia,serif" font-size="8" fill="#DCD8CD" font-weight="bold">Lofi Study Beats</text>
  <text x="57" y="268" font-family="monospace" font-size="7" fill="#A49F92">ChilledCow · YouTube</text>
  <rect x="57" y="274" width="34" height="2" rx="1" fill="#E8432A"/>
  <polygon points="166,272 166,290 180,281" fill="#E8432A"/>

  <!-- Card 2: Top right - Library -->
  <rect x="196" y="160" width="118" height="66" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <line x1="210" y1="182" x2="248" y2="182" stroke="#6F6A5E" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="210" y1="189" x2="238" y2="189" stroke="#6F6A5E" stroke-width="1.5" stroke-linecap="round"/>
  <text x="210" y="216" font-family="Georgia,serif" font-size="18" fill="#DCD8CD" font-weight="bold">47</text>
  <text x="237" y="216" font-family="monospace" font-size="7" fill="#A49F92">tracks</text>

  <!-- Card 3: Bottom right - Downloads -->
  <rect x="196" y="234" width="118" height="66" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <text x="210" y="282" font-family="Georgia,serif" font-size="18" fill="#E8432A" font-weight="bold">12</text>
  <text x="237" y="282" font-family="monospace" font-size="7" fill="#A49F92">offline</text>
  <text x="210" y="293" font-family="monospace" font-size="6" fill="#6F6A5E">yt-dlp powered</text>

  <!-- Card 4: Full-width now playing -->
  <rect x="46" y="310" width="268" height="60" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="57" y="321" width="36" height="36" rx="6" fill="#2C2821"/>
  <text x="66" y="344" font-family="Georgia,serif" font-size="15" fill="#6F6A5E">♪</text>
  <text x="103" y="336" font-family="Georgia,serif" font-size="8" fill="#DCD8CD" font-weight="bold">Midnight Jazz</text>
  <text x="103" y="348" font-family="monospace" font-size="7" fill="#A49F92">Blue Note Trio</text>
  <rect x="103" y="354" width="140" height="2" rx="1" fill="#2C2821"/>
  <rect x="103" y="354" width="52" height="2" rx="1" fill="#E8432A"/>
  <polygon points="282,326 282,346 296,336" fill="#E8432A"/>

  <!-- Card 5a: Podcasts -->
  <rect x="46" y="380" width="78" height="66" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <text x="64" y="410" font-family="Georgia,serif" font-size="20" fill="#A49F92" text-anchor="middle">&#127897;</text>
  <text x="85" y="428" font-family="Georgia,serif" font-size="7" fill="#DCD8CD" text-anchor="middle">podcasts</text>
  <text x="85" y="439" font-family="monospace" font-size="6" fill="#6F6A5E" text-anchor="middle">trending</text>

  <!-- Card 5b: Favourites -->
  <rect x="134" y="380" width="78" height="66" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <text x="173" y="410" font-family="Georgia,serif" font-size="20" fill="#E8432A" text-anchor="middle">&#9829;</text>
  <text x="173" y="428" font-family="Georgia,serif" font-size="7" fill="#DCD8CD" text-anchor="middle">favourites</text>
  <text x="173" y="439" font-family="monospace" font-size="6" fill="#6F6A5E" text-anchor="middle">24 saved</text>

  <!-- Card 5c: Offline -->
  <rect x="222" y="380" width="92" height="66" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <text x="268" y="410" font-family="Georgia,serif" font-size="20" fill="#A49F92" text-anchor="middle">&#11015;</text>
  <text x="268" y="428" font-family="Georgia,serif" font-size="7" fill="#DCD8CD" text-anchor="middle">offline</text>
  <text x="268" y="439" font-family="monospace" font-size="6" fill="#6F6A5E" text-anchor="middle">anywhere</text>

  <!-- Mini player -->
  <rect x="46" y="456" width="268" height="52" rx="14" fill="#E8432A" filter="url(#sk)"/>
  <rect x="57" y="466" width="30" height="30" rx="6" fill="#C4321A"/>
  <text x="64" y="486" font-family="Georgia,serif" font-size="13" fill="#F0EDE8">♪</text>
  <text x="97" y="478" font-family="Georgia,serif" font-size="8" fill="#FAFAF0" font-weight="bold">Midnight Jazz</text>
  <text x="97" y="491" font-family="monospace" font-size="7" fill="#FAEAE6">Blue Note Trio</text>
  <text x="264" y="488" font-family="monospace" font-size="18" fill="#FAFAF0">&#9208;</text>
  <text x="288" y="488" font-family="monospace" font-size="18" fill="#FAEAE6">&#9197;</text>

  <!-- Golden spiral nav bar -->
  <rect x="46" y="518" width="268" height="66" rx="18" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>

  <!-- Home (active) -->
  <text x="72" y="550" font-family="Georgia,serif" font-size="22" fill="#E8432A" text-anchor="middle">&#8962;</text>
  <text x="72" y="567" font-family="monospace" font-size="7" fill="#E8432A" text-anchor="middle">home</text>
  <rect x="62" y="570" width="20" height="2" rx="1" fill="#E8432A"/>

  <!-- Search -->
  <circle cx="144" cy="546" r="8" fill="none" stroke="#6F6A5E" stroke-width="1.3"/>
  <line x1="150" y1="551" x2="155" y2="556" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <text x="144" y="567" font-family="monospace" font-size="7" fill="#6F6A5E" text-anchor="middle">search</text>

  <!-- Library -->
  <line x1="200" y1="540" x2="224" y2="540" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="200" y1="547" x2="218" y2="547" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <line x1="200" y1="554" x2="214" y2="554" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <text x="212" y="567" font-family="monospace" font-size="7" fill="#6F6A5E" text-anchor="middle">library</text>

  <!-- Settings gear -->
  <circle cx="286" cy="547" r="7" fill="none" stroke="#6F6A5E" stroke-width="1.3"/>
  <circle cx="286" cy="547" r="3" fill="none" stroke="#6F6A5E" stroke-width="1.2"/>
  <text x="286" y="567" font-family="monospace" font-size="7" fill="#6F6A5E" text-anchor="middle">settings</text>

  <!-- ── ANNOTATIONS ── -->

  <!-- "bento grid" annotation left side -->
  <text x="2" y="236" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(-5,2,236)">bento</text>
  <text x="2" y="248" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(-5,2,248)">grid</text>
  <line x1="22" y1="240" x2="40" y2="238" stroke="#8A7D72" stroke-width="1" stroke-linecap="round"/>
  <polygon points="40,236 40,240 44,238" fill="#8A7D72"/>

  <!-- "mini player" annotation right side -->
  <text x="320" y="474" font-family="Georgia,serif" font-size="9" fill="#E8432A" font-style="italic" transform="rotate(4,320,474)">mini</text>
  <text x="316" y="486" font-family="Georgia,serif" font-size="9" fill="#E8432A" font-style="italic" transform="rotate(4,316,486)">player</text>
  <line x1="318" y1="480" x2="314" y2="480" stroke="#E8432A" stroke-width="1" stroke-linecap="round"/>
  <polygon points="318,478 318,482 314,480" fill="#E8432A"/>

  <!-- "φ nav" annotation bottom right -->
  <text x="318" y="550" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(3,318,550)">&#966; nav</text>
  <line x1="318" y1="548" x2="314" y2="548" stroke="#8A7D72" stroke-width="1" stroke-linecap="round"/>
  <polygon points="318,546 318,550 314,548" fill="#8A7D72"/>

</svg>
