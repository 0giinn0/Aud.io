<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 640" width="340" height="640">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n" seed="2"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Paper background -->
  <rect width="340" height="640" fill="#F7F4EE"/>
  <text x="170" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#3A352C" font-style="italic">home screen</text>

  <!-- Phone shadow + frame -->
  <rect x="30" y="44" width="288" height="560" rx="36" fill="#00000022"/>
  <rect x="26" y="40" width="288" height="560" rx="36" fill="#14120F" stroke="#3A352C" stroke-width="2" filter="url(#sk)"/>
  <rect x="130" y="52" width="80" height="16" rx="8" fill="#0A0807"/>

  <!-- Status bar -->
  <text x="46" y="68" font-family="monospace" font-size="10" fill="#6F6A5E">9:41</text>
  <text x="294" y="68" text-anchor="end" font-family="monospace" font-size="10" fill="#6F6A5E">&#9632;&#9632;&#9632;</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- GOLDEN SPIRAL NAV — active panel = DISCOVER (left 61.8%) -->
  <!-- Phone content area: x=26..314, y=74..596  (w=288 h=522) -->
  <!-- Active panel width = 288 * 0.618 = ~178px  -->
  <!-- Inactive strip width = 288 - 178 = ~110px  -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- DISCOVER panel (active) — dark background, full content -->
  <rect x="26" y="74" width="178" height="522" fill="#14120F" stroke="#14120F" stroke-width="1"/>

  <!-- Content inside DISCOVER panel -->
  <!-- Header -->
  <text x="46" y="102" font-family="Georgia,serif" font-size="16" fill="#DCD8CD" font-weight="bold">aud.io</text>
  <!-- Search bar -->
  <rect x="36" y="110" width="156" height="24" rx="8" fill="#201D18" stroke="#3A352C" stroke-width="1"/>
  <circle cx="50" cy="122" r="5" fill="none" stroke="#6F6A5E" stroke-width="1.2"/>
  <line x1="53" y1="125" x2="56" y2="128" stroke="#6F6A5E" stroke-width="1.2" stroke-linecap="round"/>
  <text x="63" y="127" font-family="monospace" font-size="7.5" fill="#6F6A5E">search...</text>

  <!-- Bento cards (compressed to fit narrower active panel) -->
  <text x="36" y="150" font-family="monospace" font-size="7" fill="#6F6A5E" letter-spacing="2">RECENTLY PLAYED</text>

  <!-- Featured card -->
  <rect x="36" y="158" width="156" height="100" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="46" y="168" width="44" height="44" rx="7" fill="#2C2821"/>
  <text x="54" y="197" font-family="Georgia,serif" font-size="18" fill="#6F6A5E">&#9835;</text>
  <text x="46" y="234" font-family="Georgia,serif" font-size="7.5" fill="#DCD8CD" font-weight="bold">Lofi Study Beats</text>
  <text x="46" y="247" font-family="monospace" font-size="6.5" fill="#A49F92">ChilledCow</text>
  <rect x="46" y="251" width="28" height="2" rx="1" fill="#E8432A"/>
  <polygon points="158,244 158,258 170,251" fill="#E8432A"/>

  <!-- Stats row -->
  <rect x="36" y="268" width="74" height="50" rx="10" fill="#201D18" stroke="#3A352C" stroke-width="1"/>
  <text x="48" y="292" font-family="Georgia,serif" font-size="15" fill="#DCD8CD" font-weight="bold">47</text>
  <text x="48" y="306" font-family="monospace" font-size="6" fill="#A49F92">tracks</text>

  <rect x="118" y="268" width="74" height="50" rx="10" fill="#201D18" stroke="#3A352C" stroke-width="1"/>
  <text x="130" y="292" font-family="Georgia,serif" font-size="15" fill="#E8432A" font-weight="bold">12</text>
  <text x="130" y="306" font-family="monospace" font-size="6" fill="#A49F92">offline</text>

  <!-- Now playing bar -->
  <rect x="36" y="328" width="156" height="48" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="46" y="338" width="28" height="28" rx="5" fill="#2C2821"/>
  <text x="52" y="357" font-family="Georgia,serif" font-size="12" fill="#6F6A5E">&#9835;</text>
  <text x="82" y="350" font-family="Georgia,serif" font-size="7.5" fill="#DCD8CD" font-weight="bold">Midnight Jazz</text>
  <text x="82" y="362" font-family="monospace" font-size="6.5" fill="#A49F92">Blue Note Trio</text>
  <rect x="82" y="367" width="80" height="2" rx="1" fill="#2C2821"/>
  <rect x="82" y="367" width="30" height="2" rx="1" fill="#E8432A"/>
  <polygon points="168,342 168,358 180,350" fill="#E8432A"/>

  <!-- Mini player -->
  <rect x="36" y="386" width="156" height="40" rx="10" fill="#E8432A"/>
  <rect x="46" y="394" width="22" height="22" rx="4" fill="#C4321A"/>
  <text x="50" y="409" font-family="Georgia,serif" font-size="10" fill="#F0EDE8">&#9835;</text>
  <text x="76" y="404" font-family="Georgia,serif" font-size="7.5" fill="#FAFAF0" font-weight="bold">Midnight Jazz</text>
  <text x="76" y="415" font-family="monospace" font-size="6.5" fill="#FAEAE6">Blue Note Trio</text>
  <text x="163" y="412" font-family="Georgia,serif" font-size="14" fill="#FAFAF0">&#9208;</text>

  <!-- Section label in bottom of active panel -->
  <text x="36" y="440" font-family="monospace" font-size="7" fill="#6F6A5E" letter-spacing="3">01</text>
  <text x="54" y="440" font-family="monospace" font-size="7" fill="#6F6A5E" letter-spacing="2">DISCOVER</text>

  <!-- ═══════════════════════════════════════════════════════ -->
  <!-- INACTIVE PANELS — right strip (x=204..314, w=110)      -->
  <!-- Split right strip: PODCASTS top 61.8% = 322px h        -->
  <!-- LIBRARY + SETTINGS fill remaining 200px                 -->
  <!--   LIBRARY = 200 * 0.618 = ~124px                       -->
  <!--   SETTINGS = remaining ~76px                           -->
  <!-- ═══════════════════════════════════════════════════════ -->

  <!-- PODCASTS panel (cream background, ink text) -->
  <!-- y=74, h=322 (61.8% of 522) -->
  <rect x="204" y="74" width="110" height="323" fill="#DCD8CD" stroke="#14120F" stroke-width="1"/>
  <!-- Big numeral -->
  <text x="212" y="150" font-family="Georgia,serif" font-size="52" fill="#14120F" font-weight="bold" opacity="0.85">02</text>
  <!-- Circle motif (bottom-right corner) -->
  <circle cx="314" cy="397" r="68" fill="none" stroke="#14120F" stroke-width="1" opacity="0.14"/>
  <circle cx="314" cy="397" r="42" fill="#14120F" opacity="0.14"/>
  <!-- Icon + label -->
  <text x="212" y="350" font-family="monospace" font-size="9" fill="#14120F" letter-spacing="1">PODCASTS</text>

  <!-- LIBRARY panel (red background, cream text) -->
  <!-- y=397, h=124 (61.8% of 199) -->
  <rect x="204" y="397" width="110" height="124" fill="#E8432A" stroke="#14120F" stroke-width="1"/>
  <text x="212" y="458" font-family="Georgia,serif" font-size="34" fill="#DCD8CD" font-weight="bold" opacity="0.9">03</text>
  <!-- Circle motif -->
  <circle cx="314" cy="521" r="42" fill="none" stroke="#DCD8CD" stroke-width="1" opacity="0.2"/>
  <circle cx="314" cy="521" r="26" fill="#DCD8CD" opacity="0.2"/>
  <text x="212" y="508" font-family="monospace" font-size="8" fill="#DCD8CD" letter-spacing="1">LIBRARY</text>

  <!-- SETTINGS panel (cream background, red text) -->
  <!-- y=521, h=75 -->
  <rect x="204" y="521" width="110" height="75" fill="#DCD8CD" stroke="#14120F" stroke-width="1"/>
  <text x="212" y="565" font-family="Georgia,serif" font-size="24" fill="#E8432A" font-weight="bold" opacity="0.9">04</text>
  <!-- Circle motif -->
  <circle cx="314" cy="596" r="28" fill="none" stroke="#E8432A" stroke-width="1" opacity="0.2"/>
  <text x="212" y="584" font-family="monospace" font-size="7.5" fill="#E8432A" letter-spacing="1">SETTINGS</text>

  <!-- Ink border between active panel and spiral panels -->
  <line x1="204" y1="74" x2="204" y2="596" stroke="#14120F" stroke-width="1.5"/>

  <!-- OUTSIDE ANNOTATIONS -->
  <text x="2" y="200" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(-5,2,200)">bento</text>
  <text x="2" y="212" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(-5,2,212)">grid</text>
  <path d="M23,206 L33,206" fill="none" stroke="#8A7D72" stroke-width="1" stroke-linecap="round"/>
  <polyline points="31,204 33,206 31,208" fill="none" stroke="#8A7D72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- Golden spiral label -->
  <text x="308" y="210" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">golden</text>
  <text x="306" y="222" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">spiral</text>
  <text x="309" y="234" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">&#966; nav</text>
  <path d="M314,240 L314,397" fill="none" stroke="#8A7D72" stroke-width="0.8" stroke-dasharray="3,2" stroke-linecap="round"/>

  <!-- mini player label -->
  <text x="2" y="400" font-family="Georgia,serif" font-size="9" fill="#E8432A" font-style="italic">mini</text>
  <text x="2" y="412" font-family="Georgia,serif" font-size="9" fill="#E8432A" font-style="italic">player</text>
  <path d="M23,406 L33,406" fill="none" stroke="#E8432A" stroke-width="1" stroke-linecap="round"/>
  <polyline points="31,404 33,406 31,408" fill="none" stroke="#E8432A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
