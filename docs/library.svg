<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 640" width="340" height="640">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n" seed="7"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2.5" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>

  <!-- Paper background -->
  <rect width="340" height="640" fill="#F7F4EE"/>

  <!-- Page title -->
  <text x="170" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#3A352C" font-style="italic">library</text>

  <!-- Phone shadow -->
  <rect x="30" y="44" width="288" height="560" rx="36" fill="#00000022"/>

  <!-- Phone frame -->
  <rect x="26" y="40" width="288" height="560" rx="36" fill="#14120F" stroke="#3A352C" stroke-width="2" filter="url(#sk)"/>

  <!-- Dynamic island -->
  <rect x="130" y="52" width="80" height="16" rx="8" fill="#0A0807"/>

  <!-- Status bar -->
  <text x="46" y="68" font-family="monospace" font-size="10" fill="#6F6A5E">9:41</text>
  <text x="294" y="68" text-anchor="end" font-family="monospace" font-size="10" fill="#6F6A5E">■■■</text>

  <!-- Library header -->
  <text x="46" y="96" font-family="Georgia,serif" font-size="18" fill="#DCD8CD" font-weight="bold">Library</text>

  <!-- Tabs row -->
  <!-- Active: Playlists -->
  <rect x="46" y="104" width="78" height="22" rx="11" fill="#E8432A"/>
  <text x="85" y="119" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#FAFAF0" font-weight="bold">Playlists</text>

  <!-- Inactive: Local Files -->
  <rect x="132" y="104" width="78" height="22" rx="11" fill="#201D18" stroke="#3A352C" stroke-width="1"/>
  <text x="171" y="119" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#6F6A5E">Local Files</text>

  <!-- Inactive: Spotify -->
  <rect x="218" y="104" width="62" height="22" rx="11" fill="#201D18" stroke="#3A352C" stroke-width="1"/>
  <text x="249" y="119" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#6F6A5E">Spotify</text>

  <!-- YOUR PLAYLISTS label -->
  <text x="46" y="140" font-family="monospace" font-size="8" fill="#6F6A5E" letter-spacing="2">YOUR PLAYLISTS</text>

  <!-- Playlist item 1: Favourites -->
  <rect x="46" y="148" width="248" height="50" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="58" y="158" width="30" height="30" rx="6" fill="#2C2821"/>
  <text x="73" y="178" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#E8432A">♥</text>
  <text x="98" y="170" font-family="Georgia,serif" font-size="9" fill="#DCD8CD" font-weight="bold">Favourites</text>
  <text x="98" y="183" font-family="monospace" font-size="7" fill="#A49F92">24 tracks</text>
  <text x="284" y="177" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">›</text>

  <!-- Playlist item 2: Late Night Drive -->
  <rect x="46" y="206" width="248" height="50" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="58" y="216" width="30" height="30" rx="6" fill="#2C2821"/>
  <text x="73" y="236" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">♪</text>
  <text x="98" y="228" font-family="Georgia,serif" font-size="9" fill="#DCD8CD" font-weight="bold">Late Night Drive</text>
  <text x="98" y="241" font-family="monospace" font-size="7" fill="#A49F92">12 tracks</text>
  <text x="284" y="235" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">›</text>

  <!-- Playlist item 3: Coding Focus -->
  <rect x="46" y="264" width="248" height="50" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="58" y="274" width="30" height="30" rx="6" fill="#2C2821"/>
  <text x="73" y="294" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">♪</text>
  <text x="98" y="286" font-family="Georgia,serif" font-size="9" fill="#DCD8CD" font-weight="bold">Coding Focus</text>
  <text x="98" y="299" font-family="monospace" font-size="7" fill="#A49F92">31 tracks</text>
  <text x="284" y="293" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">›</text>

  <!-- Playlist item 4: Workout Hits -->
  <rect x="46" y="322" width="248" height="50" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <rect x="58" y="332" width="30" height="30" rx="6" fill="#2C2821"/>
  <text x="73" y="352" text-anchor="middle" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">♪</text>
  <text x="98" y="344" font-family="Georgia,serif" font-size="9" fill="#DCD8CD" font-weight="bold">Workout Hits</text>
  <text x="98" y="357" font-family="monospace" font-size="7" fill="#A49F92">8 tracks</text>
  <text x="284" y="351" text-anchor="end" font-family="Georgia,serif" font-size="14" fill="#6F6A5E">›</text>

  <!-- Playlist item 5: + New Playlist (dashed) -->
  <rect x="46" y="380" width="248" height="50" rx="12" fill="none" stroke="#3A352C" stroke-width="1" stroke-dasharray="5,3"/>
  <text x="170" y="410" text-anchor="middle" font-family="Georgia,serif" font-size="11" fill="#6F6A5E">+ New Playlist</text>

  <!-- ACCOUNT section -->
  <text x="46" y="446" font-family="monospace" font-size="8" fill="#6F6A5E" letter-spacing="2">ACCOUNT</text>

  <!-- Account card -->
  <rect x="46" y="454" width="248" height="56" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <!-- Avatar -->
  <circle cx="72" cy="482" r="14" fill="#2C2821" stroke="#3A352C" stroke-width="1"/>
  <circle cx="72" cy="478" r="5" fill="#6F6A5E"/>
  <path d="M62,493 Q72,488 82,493" fill="#6F6A5E"/>
  <!-- Text -->
  <text x="95" y="475" font-family="Georgia,serif" font-size="9" fill="#DCD8CD" font-weight="bold">Sign in</text>
  <text x="95" y="488" font-family="monospace" font-size="7" fill="#A49F92">Sync across devices</text>
  <!-- Social icons -->
  <circle cx="96" cy="500" r="6" fill="#2C2821" stroke="#3A352C" stroke-width="1"/>
  <text x="96" y="504" text-anchor="middle" font-family="monospace" font-size="6" fill="#A49F92">G</text>
  <circle cx="112" cy="500" r="6" fill="#2C2821" stroke="#3A352C" stroke-width="1"/>
  <text x="112" y="504" text-anchor="middle" font-family="monospace" font-size="6" fill="#A49F92">A</text>

  <!-- TRANSFER FILES section -->
  <text x="46" y="524" font-family="monospace" font-size="8" fill="#6F6A5E" letter-spacing="2">TRANSFER FILES</text>

  <!-- Transfer card -->
  <rect x="46" y="532" width="248" height="52" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <!-- WiFi arc icon -->
  <path d="M60,558 Q67,550 76,550 Q85,550 92,558" fill="none" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <path d="M64,562 Q70,557 76,557 Q82,557 88,562" fill="none" stroke="#6F6A5E" stroke-width="1.3" stroke-linecap="round"/>
  <circle cx="76" cy="566" r="2.5" fill="#6F6A5E"/>
  <text x="102" y="550" font-family="Georgia,serif" font-size="9" fill="#DCD8CD" font-weight="bold">Transfer</text>
  <text x="102" y="563" font-family="monospace" font-size="6.5" fill="#A49F92">Import URL · Export M3U/JSON</text>
  <text x="102" y="574" font-family="monospace" font-size="6.5" fill="#A49F92">WiFi send to other devices</text>

  <!-- Nav bar -->
  <rect x="46" y="592" width="248" height="40" rx="14" fill="#201D18" stroke="#3A352C" stroke-width="1" filter="url(#sk)"/>
  <text x="80" y="617" font-family="Georgia,serif" font-size="18" fill="#6F6A5E" text-anchor="middle">⌂</text>
  <circle cx="130" cy="609" r="6" fill="none" stroke="#6F6A5E" stroke-width="1.2"/>
  <line x1="134" y1="614" x2="137" y2="617" stroke="#6F6A5E" stroke-width="1.2" stroke-linecap="round"/>
  <!-- Library active -->
  <line x1="170" y1="605" x2="190" y2="605" stroke="#E8432A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="611" x2="186" y2="611" stroke="#E8432A" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="170" y1="617" x2="183" y2="617" stroke="#E8432A" stroke-width="1.5" stroke-linecap="round"/>
  <circle cx="250" cy="610" r="7" fill="none" stroke="#6F6A5E" stroke-width="1.2"/>
  <circle cx="250" cy="610" r="3" fill="none" stroke="#6F6A5E" stroke-width="1.1"/>

  <!-- OUTSIDE ANNOTATIONS -->

  <!-- "hive local storage" near playlists -->
  <text x="2" y="266" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(-4,2,266)">hive local</text>
  <text x="2" y="278" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic" transform="rotate(-4,2,278)">storage</text>
  <path d="M 24 272 L 42 272" fill="none" stroke="#8A7D72" stroke-width="1" stroke-linecap="round"/>
  <polyline points="40,270 42,272 40,274" fill="none" stroke="#8A7D72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "spotify import" near account -->
  <text x="308" y="460" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">spotify</text>
  <text x="308" y="472" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">import</text>
  <path d="M 314 466 L 298 480" fill="none" stroke="#8A7D72" stroke-width="1" stroke-linecap="round"/>
  <polyline points="300,478 298,480 300,482" fill="none" stroke="#8A7D72" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- "wifi transfer" near transfer section -->
  <text x="310" y="546" font-family="Georgia,serif" font-size="9" fill="#E8432A" font-style="italic">wifi</text>
  <text x="306" y="558" font-family="Georgia,serif" font-size="9" fill="#E8432A" font-style="italic">transfer</text>
  <path d="M 312 552 L 298 558" fill="none" stroke="#E8432A" stroke-width="1" stroke-linecap="round"/>
  <polyline points="300,556 298,558 300,560" fill="none" stroke="#E8432A" stroke-width="1" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
