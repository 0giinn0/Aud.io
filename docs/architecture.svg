<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" width="720" height="420">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#1C1C1C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#E8432A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#A49F92" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowGold" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#C9A24B" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper background -->
  <rect width="720" height="420" fill="#F7F4EE"/>

  <!-- Title -->
  <text x="360" y="28" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#1C1C1C" font-weight="bold">aud.io architecture</text>
  <text x="360" y="44" text-anchor="middle" font-family="monospace" font-size="8" fill="#8A7D72" font-style="italic">no backend · no Cloudflare · no Render · just GitHub + client-side APIs</text>

  <!-- ─── BOX: Flutter App (center-left, large) ─── -->
  <rect x="30" y="120" width="200" height="160" rx="14" fill="#1C1C16" stroke="#E8432A" stroke-width="2.5" filter="url(#sk)"/>
  <text x="130" y="148" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#E8432A" font-weight="bold">Flutter App</text>
  <text x="130" y="166" text-anchor="middle" font-family="monospace" font-size="8" fill="#DCD8CD">APK · iOS · Web</text>
  <!-- Internal modules -->
  <rect x="48" y="180" width="74" height="26" rx="6" fill="#2A2620" stroke="#3A352C" stroke-width="1"/>
  <text x="85" y="197" text-anchor="middle" font-family="monospace" font-size="7" fill="#C9A24B">just_audio</text>
  <rect x="138" y="180" width="74" height="26" rx="6" fill="#2A2620" stroke="#3A352C" stroke-width="1"/>
  <text x="175" y="197" text-anchor="middle" font-family="monospace" font-size="7" fill="#C9A24B">Hive DB</text>
  <rect x="48" y="214" width="74" height="26" rx="6" fill="#2A2620" stroke="#3A352C" stroke-width="1"/>
  <text x="85" y="231" text-anchor="middle" font-family="monospace" font-size="7" fill="#C9A24B">youtube_explode</text>
  <rect x="138" y="214" width="74" height="26" rx="6" fill="#2A2620" stroke="#3A352C" stroke-width="1"/>
  <text x="175" y="231" text-anchor="middle" font-family="monospace" font-size="7" fill="#C9A24B">dart_ytmusic</text>
  <rect x="48" y="248" width="164" height="22" rx="6" fill="#2A2620" stroke="#3A352C" stroke-width="1"/>
  <text x="130" y="263" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">SoundCloud · Podcast · CORS proxy</text>

  <!-- ─── BOX: GitHub ─── -->
  <rect x="30" y="310" width="200" height="50" rx="10" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="130" y="330" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">GitHub</text>
  <text x="130" y="348" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">Pages (web) · Releases (APK + iOS)</text>

  <!-- ─── BOX: CORS Proxies (web only) ─── -->
  <rect x="280" y="120" width="130" height="100" rx="12" fill="#F0EDE8" stroke="#C9A24B" stroke-width="2" filter="url(#sk)"/>
  <text x="345" y="145" text-anchor="middle" font-family="monospace" font-size="8" fill="#C9A24B">web only</text>
  <text x="345" y="165" text-anchor="middle" font-family="Georgia,serif" font-size="13" fill="#1C1C1C" font-weight="bold">CORS Proxy</text>
  <text x="345" y="182" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">corsproxy.io</text>
  <text x="345" y="193" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">codetabs.com</text>
  <text x="345" y="204" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">allorigins · thingproxy</text>
  <text x="345" y="215" text-anchor="middle" font-family="monospace" font-size="6" fill="#A49F92" font-style="italic">multi-proxy fallback</text>

  <!-- ─── BOX: YouTube Music ─── -->
  <rect x="460" y="60" width="150" height="70" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" filter="url(#sk)"/>
  <text x="535" y="86" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">YouTube Music</text>
  <text x="535" y="101" text-anchor="middle" font-family="monospace" font-size="7" fill="#6A6560">InnerTube API (direct)</text>
  <text x="535" y="115" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">search · stream · download</text>

  <!-- ─── BOX: SoundCloud ─── -->
  <rect x="460" y="155" width="150" height="70" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" filter="url(#sk)"/>
  <text x="535" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">SoundCloud</text>
  <text x="535" y="196" text-anchor="middle" font-family="monospace" font-size="7" fill="#6A6560">v2 API (client-side)</text>
  <text x="535" y="210" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">scraped client_id · search · stream</text>

  <!-- ─── BOX: Podcast Index ─── -->
  <rect x="460" y="250" width="150" height="70" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" filter="url(#sk)"/>
  <text x="535" y="276" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">Podcast Index</text>
  <text x="535" y="291" text-anchor="middle" font-family="monospace" font-size="7" fill="#6A6560">free API (client-side)</text>
  <text x="535" y="305" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">search · trending · RSS · episodes</text>

  <!-- ─── BOX: LRCLIB (lyrics) ─── -->
  <rect x="460" y="345" width="150" height="45" rx="10" fill="#F0EDE8" stroke="#A49F92" stroke-width="1.2" stroke-dasharray="4,3" filter="url(#sk)"/>
  <text x="535" y="365" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1C1C1C" font-weight="bold">LRCLIB</text>
  <text x="535" y="380" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">synced lyrics (free)</text>

  <!-- ─── ARROWS ─── -->

  <!-- 1. Flutter App → CORS Proxy (web only, gold) -->
  <line x1="231" y1="170" x2="278" y2="170" stroke="#C9A24B" stroke-width="1.8" stroke-linecap="round" marker-end="url(#arrowGold)"/>
  <text x="254" y="163" text-anchor="middle" font-family="monospace" font-size="7" fill="#C9A24B">web</text>

  <!-- 2. CORS Proxy → YouTube Music -->
  <path d="M410,150 Q435,120 458,95" fill="none" stroke="#C9A24B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowGold)"/>

  <!-- 3. CORS Proxy → SoundCloud -->
  <line x1="411" y1="190" x2="458" y2="190" stroke="#C9A24B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowGold)"/>

  <!-- 4. CORS Proxy → Podcast Index -->
  <path d="M410,210 Q435,235 458,260" fill="none" stroke="#C9A24B" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrowGold)"/>

  <!-- 5. Flutter App → YouTube Music (native, direct, black) -->
  <path d="M231,150 Q350,100 458,90" fill="none" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="350" y="95" text-anchor="middle" font-family="Georgia,serif" font-size="7" fill="#A49F92" font-style="italic">native (direct)</text>

  <!-- 6. Flutter App → SoundCloud (native, direct) -->
  <path d="M231,190 Q345,190 458,190" fill="none" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- 7. Flutter App → Podcast Index (native, direct) -->
  <path d="M231,235 Q345,260 458,270" fill="none" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="5,3" marker-end="url(#arrow)"/>

  <!-- 8. Flutter App → LRCLIB -->
  <path d="M231,265 Q350,330 458,360" fill="none" stroke="#A49F92" stroke-width="1.2" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>

  <!-- 9. GitHub → Flutter App (builds + hosts, dashed) -->
  <line x1="130" y1="309" x2="130" y2="281" stroke="#A49F92" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
  <text x="150" y="298" font-family="Georgia,serif" font-size="7" fill="#A49F92" font-style="italic">builds &amp; hosts</text>

  <!-- Footer note -->
  <text x="360" y="408" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">Native (APK/iOS): direct API calls · Web: routes through public CORS proxies</text>
</svg>
