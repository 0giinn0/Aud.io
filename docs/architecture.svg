<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" width="720" height="400">
  <defs>
    <filter id="sk" x="-4%" y="-4%" width="108%" height="108%">
      <feTurbulence type="fractalNoise" baseFrequency="0.018" numOctaves="2" result="n" seed="3"/>
      <feDisplacementMap in="SourceGraphic" in2="n" scale="2" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#1C1C1C" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowRed" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#E8432A" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <marker id="arrowMuted" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polyline points="0,0 6,3 0,6" fill="none" stroke="#A49F92" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <!-- Paper background -->
  <rect width="720" height="400" fill="#F7F4EE"/>

  <!-- Title -->
  <text x="360" y="30" text-anchor="middle" font-family="Georgia,serif" font-size="18" fill="#1C1C1C" font-weight="bold">aud.io architecture</text>

  <!-- ─── BOX: User / Browser ─── -->
  <rect x="20" y="155" width="110" height="80" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="2" filter="url(#sk)"/>
  <!-- Phone icon -->
  <rect x="54" y="166" width="20" height="32" rx="4" fill="none" stroke="#1C1C1C" stroke-width="1.3"/>
  <circle cx="64" cy="193" r="2" fill="#1C1C1C"/>
  <text x="64" y="212" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#1C1C1C" font-weight="bold">User</text>
  <text x="64" y="224" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">Flutter Web</text>

  <!-- ─── BOX: Cloudflare Pages ─── -->
  <rect x="180" y="140" width="130" height="110" rx="12" fill="#1C1C16" stroke="#E8432A" stroke-width="2" filter="url(#sk)"/>
  <text x="245" y="165" text-anchor="middle" font-family="monospace" font-size="9" fill="#E8432A">Cloudflare</text>
  <text x="245" y="185" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#DCD8CD" font-weight="bold">Pages</text>
  <text x="245" y="200" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">Flutter Web (CDN)</text>
  <text x="245" y="213" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">global edge network</text>
  <text x="245" y="238" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">auto-deploy via CI/CD</text>

  <!-- ─── BOX: Render / Node.js ─── -->
  <rect x="370" y="140" width="140" height="110" rx="12" fill="#201D18" stroke="#3A352C" stroke-width="2" filter="url(#sk)"/>
  <text x="440" y="163" text-anchor="middle" font-family="monospace" font-size="8" fill="#A49F92">Render.com</text>
  <text x="440" y="183" text-anchor="middle" font-family="Georgia,serif" font-size="16" fill="#DCD8CD" font-weight="bold">Node.js</text>
  <text x="440" y="200" text-anchor="middle" font-family="monospace" font-size="10" fill="#E8432A">/api/*</text>
  <text x="440" y="214" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">Express · CORS · rate limit</text>
  <text x="440" y="228" text-anchor="middle" font-family="monospace" font-size="7" fill="#6F6A5E">yt-dlp for downloads</text>

  <!-- ─── BOX: YouTube Music ─── -->
  <rect x="570" y="55" width="138" height="68" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" filter="url(#sk)"/>
  <text x="639" y="81" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">YouTube Music</text>
  <text x="639" y="96" text-anchor="middle" font-family="monospace" font-size="8" fill="#6A6560">InnerTube + yt-dlp</text>
  <text x="639" y="110" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">search · stream · download</text>

  <!-- ─── BOX: SoundCloud ─── -->
  <rect x="570" y="155" width="138" height="68" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" filter="url(#sk)"/>
  <text x="639" y="181" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">SoundCloud</text>
  <text x="639" y="196" text-anchor="middle" font-family="monospace" font-size="8" fill="#6A6560">API proxy</text>
  <text x="639" y="210" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">search · stream</text>

  <!-- ─── BOX: Podcast Index ─── -->
  <rect x="570" y="255" width="138" height="68" rx="12" fill="#F0EDE8" stroke="#1C1C1C" stroke-width="1.5" filter="url(#sk)"/>
  <text x="639" y="281" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">Podcast Index</text>
  <text x="639" y="296" text-anchor="middle" font-family="monospace" font-size="8" fill="#6A6560">open podcast API</text>
  <text x="639" y="310" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">search · trending · episodes</text>

  <!-- ─── BOX: Hive DB (local) ─── -->
  <rect x="20" y="278" width="110" height="60" rx="12" fill="#F0EDE8" stroke="#A49F92" stroke-width="1.5" stroke-dasharray="5,3" filter="url(#sk)"/>
  <text x="75" y="303" text-anchor="middle" font-family="Georgia,serif" font-size="10" fill="#1C1C1C" font-weight="bold">Hive DB</text>
  <text x="75" y="318" text-anchor="middle" font-family="monospace" font-size="8" fill="#6A6560">local · offline</text>
  <text x="75" y="330" text-anchor="middle" font-family="monospace" font-size="7" fill="#A49F92">playlists · favourites</text>

  <!-- ─── ARROWS ─── -->

  <!-- 1. User → Cloudflare Pages (serves app) -->
  <line x1="131" y1="195" x2="178" y2="195" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="155" y="190" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">serves app</text>

  <!-- 2. Cloudflare Pages → Render (API calls, RED, key flow) -->
  <line x1="311" y1="195" x2="368" y2="195" stroke="#E8432A" stroke-width="2" stroke-linecap="round" marker-end="url(#arrowRed)"/>
  <text x="340" y="188" text-anchor="middle" font-family="monospace" font-size="8" fill="#E8432A">/api/*</text>

  <!-- 3. Render → YouTube Music (right-up) -->
  <path d="M510,175 Q548,150 568,108" fill="none" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="550" y="148" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">InnerTube</text>

  <!-- 4. Render → SoundCloud (straight right) -->
  <line x1="511" y1="195" x2="568" y2="195" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="538" y="188" text-anchor="middle" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">proxy</text>

  <!-- 5. Render → Podcast Index (right-down) -->
  <path d="M510,215 Q548,240 568,275" fill="none" stroke="#1C1C1C" stroke-width="1.5" stroke-linecap="round" marker-end="url(#arrow)"/>
  <text x="532" y="258" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">PodcastIndex</text>
  <text x="532" y="269" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">API</text>

  <!-- 6. User ↔ Hive (double-headed, local storage) -->
  <!-- Down arrow User→Hive -->
  <line x1="75" y1="237" x2="75" y2="276" stroke="#A49F92" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
  <!-- Up arrow Hive→User -->
  <line x1="68" y1="276" x2="68" y2="238" stroke="#A49F92" stroke-width="1.3" stroke-linecap="round" stroke-dasharray="4,3" marker-end="url(#arrowMuted)"/>
  <text x="40" y="260" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">offline</text>
  <text x="40" y="271" font-family="Georgia,serif" font-size="8" fill="#A49F92" font-style="italic">cache</text>

  <!-- Footer note -->
  <text x="360" y="388" text-anchor="middle" font-family="Georgia,serif" font-size="9" fill="#8A7D72" font-style="italic">Flutter runs in browser — all API calls route through Render to bypass CORS</text>
</svg>
