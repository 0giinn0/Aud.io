services:
  - type: web
    name: aud-io-server
    runtime: docker
    repo: https://github.com/0giinn0/Aud.io
    branch: main
    # Paths are relative to the repo root; the Node server lives in aud.io/server.
    dockerfilePath: ./aud.io/server/Dockerfile
    dockerContext: ./aud.io/server
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "10000"
      - key: PODCAST_INDEX_API_KEY
        sync: false
      - key: PODCAST_INDEX_API_SECRET
        sync: false
      - key: PODCAST_INDEX_USER_AGENT
        value: aud.io/1.0
      - key: SOUNDCLOUD_CLIENT_ID
        sync: false
